<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850">
  <!-- positive terminal cap -->
  <rect x="112" y="34" width="56" height="22" rx="4" class="dfd"/>
  <rect x="64" y="56" width="152" height="18" rx="4" class="dfd" fill-opacity=".7"/>
  <!-- can (negative terminal) -->
  <path d="M60 74V588Q60 604 76 604H204Q220 604 220 588V74" fill="none" class="ds" stroke-width="4"/>
  <!-- jelly roll cut open: cathode / separator / anode / separator, mirrored about the vent tube -->
  <g fill-opacity=".8">
    <rect x="68" y="104" width="7" height="474" class="dfo"/><rect x="75" y="104" width="7" height="474" class="dfd" fill-opacity=".35"/><rect x="82" y="104" width="7" height="474" class="dfb"/><rect x="89" y="104" width="7" height="474" class="dfd" fill-opacity=".35"/>
    <rect x="96" y="104" width="7" height="474" class="dfo"/><rect x="103" y="104" width="7" height="474" class="dfd" fill-opacity=".35"/><rect x="110" y="104" width="7" height="474" class="dfb"/><rect x="117" y="104" width="7" height="474" class="dfd" fill-opacity=".35"/>
    <rect x="156" y="104" width="7" height="474" class="dfd" fill-opacity=".35"/><rect x="163" y="104" width="7" height="474" class="dfb"/><rect x="170" y="104" width="7" height="474" class="dfd" fill-opacity=".35"/><rect x="177" y="104" width="7" height="474" class="dfo"/>
    <rect x="184" y="104" width="7" height="474" class="dfd" fill-opacity=".35"/><rect x="191" y="104" width="7" height="474" class="dfb"/><rect x="198" y="104" width="7" height="474" class="dfd" fill-opacity=".35"/><rect x="205" y="104" width="7" height="474" class="dfo"/>
  </g>
  <!-- vent tube -->
  <rect x="128" y="96" width="24" height="490" rx="4" class="df ds2" stroke-width="2.5"/>
  <!-- tabs -->
  <path d="M180 104V86L150 74" fill="none" class="dso" stroke-width="5"/>
  <path d="M86 578V594L110 604" fill="none" class="dsb" stroke-width="5"/>
  <!-- leaders and labels -->
  <g class="ds3" stroke-width="2" fill="none">
    <path d="M168 45H290"/><path d="M160 80H290"/><path d="M212 200H290"/><path d="M140 330H290"/><path d="M98 590Q98 640 290 640"/><path d="M220 560H290"/>
  </g>
  <g font-size="24" class="dt">
    <text x="298" y="53" font-weight="700">+ Positive terminal</text>
    <text x="298" y="88" class="dto">Cathode tab</text>
    <text x="298" y="194" font-weight="700">Jelly roll</text>
    <text x="298" y="224" font-size="22" class="dt2">electrode sheets wound</text>
    <text x="298" y="252" font-size="22" class="dt2">up together</text>
    <text x="298" y="338">Vent tube</text>
    <text x="298" y="568" font-weight="700">− Negative terminal</text>
    <text x="298" y="596" font-size="22" class="dt2">(the can)</text>
    <text x="298" y="648" class="dtb">Anode tab</text>
  </g>
  <!-- the layers, unrolled -->
  <path d="M0 682H600" class="ds3" stroke-width="2"/>
  <text x="14" y="716" font-size="24" font-weight="700" class="dt">One turn of the roll</text>
  <rect x="14" y="736" width="130" height="24" class="dfo" fill-opacity=".8"/>
  <rect x="14" y="762" width="130" height="24" class="dfd" fill-opacity=".35"/>
  <rect x="14" y="788" width="130" height="24" class="dfb" fill-opacity=".8"/>
  <rect x="14" y="814" width="130" height="24" class="dfd" fill-opacity=".35"/>
  <text x="160" y="756" font-size="22" class="dto">cathode (+)</text>
  <text x="160" y="782" font-size="22" class="dt2">separator</text>
  <text x="160" y="808" font-size="22" class="dtb">anode (−)</text>
  <text x="160" y="834" font-size="22" class="dt2">separator</text>
</svg>
