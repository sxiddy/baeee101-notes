<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 820">
<defs><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfw"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfb"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfo"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfr"/></marker></defs>
<text x="20" y="34" font-size="24" class="dt" font-weight="700">Single point cutting tool (side view)</text><path d="M30 80L330 80L470 112L440 190L30 190L30 80" class="ds" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M330 80L470 112" class="dsb" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M470 112L440 190" class="dso" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M470 112L560 112" class="ds3" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><path d="M470 112L470 230" class="ds3" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><path d="M545 112A75 75 0 0 0 543 95" class="dsb" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="560" y="92" font-size="24" class="dtb" font-style="italic">α</text><path d="M470 182A70 70 0 0 1 458 179" class="dso" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="478" y="214" font-size="24" class="dto" font-style="italic">γ</text><path d="M470 112C500 80 500 50 470 45C445 42 440 65 455 70" class="ds2" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="500" y="48" font-size="22" class="dt2">chip</text><path d="M380 230L600 230" class="ds" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="590" y="256" font-size="22" class="dt2" text-anchor="end">work</text><text x="140" y="145" font-size="24" class="dt" text-anchor="middle">Shank</text><text x="300" y="72" font-size="24" class="dtb" text-anchor="middle">Face (rake face)</text><text x="420" y="250" font-size="24" class="dto" text-anchor="end">Flank</text><text x="300" y="280" font-size="22" class="dt" text-anchor="middle">Tip: cutting edge and nose</text><text x="20" y="316" font-size="22" class="dtb">α = rake angle (chip flow, cutting force)</text><text x="20" y="346" font-size="22" class="dto">γ = relief (clearance) angle: flank clears the work</text><text x="20" y="400" font-size="24" class="dt" font-weight="700">Multi-point tool: plain milling cutter</text><path d="M372 530L402 530L383.1 564.4L362.4 566L362.4 566L388.3 581L354.8 601.4L336 592.4L336 592.4L351 618.3L311.7 619.2L300 602L300 602L300 632L265.6 613.1L264 592.4L264 592.4L249 618.3L228.6 584.8L237.6 566L237.6 566L211.7 581L210.8 541.7L228 530L228 530L198 530L216.9 495.6L237.6 494L237.6 494L211.7 479L245.2 458.6L264 467.6L264 467.6L249 441.7L288.3 440.8L300 458L300 458L300 428L334.4 446.9L336 467.6L336 467.6L351 441.7L371.4 475.2L362.4 494L362.4 494L388.3 479L389.2 518.3L372 530Z" class="ds" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="300" cy="530" r="18" class="ds" fill="none" stroke-width="2.5"/><path d="M425 530A125 125 0 0 0 345.3 413.5" class="dsb" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ab)"/><text x="470" y="470" font-size="22" class="dtb">rotation</text><path d="M120 640L480 640L480 700L120 700L120 640" class="ds" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="300" y="680" font-size="22" class="dt2" text-anchor="middle">workpiece</text><path d="M150 725L260 725" class="dso" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ao)"/><text x="270" y="733" font-size="22" class="dto">table feed</text><text x="20" y="775" font-size="22" class="dt">Each tooth is a small single point edge with its</text><text x="20" y="803" font-size="22" class="dt">own rake and relief; teeth cut one after another.</text>
</svg>
