<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440">
  <!-- left: cold, every electron in the valence band -->
  <rect x="52" y="10" width="236" height="90" class="dfy" fill-opacity=".32"/>
  <path d="M52 100H288" class="ds" stroke-width="4"/>
  <text x="170" y="62" font-size="22" class="dt" text-anchor="middle">conduction band</text>
  <text x="46" y="108" font-size="22" font-weight="700" class="dt" text-anchor="end">E₀</text>
  <path d="M150 116V186" class="ds" stroke-width="3.5"/><path d="M141 118 150 104 159 118zM141 184 150 198 159 184z" class="dfw"/>
  <text x="166" y="162" font-size="26" font-weight="700" class="dt">E<tspan font-size="18" dy="6">g</tspan></text>
  <rect x="52" y="202" width="236" height="100" class="dfb" fill-opacity=".32"/>
  <path d="M52 202H288" class="ds" stroke-width="2.5"/>
  <path d="M52 236H288M52 270H288" class="ds3" stroke-width="2"/>
  <text x="46" y="210" font-size="22" font-weight="700" class="dt" text-anchor="end">Eᵥ</text>
  <g class="dfr">
    <circle cx="206" cy="202" r="9"/><circle cx="234" cy="202" r="9"/>
    <circle cx="80" cy="236" r="9"/><circle cx="108" cy="236" r="9"/>
    <circle cx="210" cy="270" r="9"/><circle cx="238" cy="270" r="9"/>
    <circle cx="110" cy="290" r="9"/><circle cx="138" cy="290" r="9"/>
  </g>
  <text x="170" y="340" font-size="24" font-weight="700" class="dt" text-anchor="middle">Cold</text>
  <text x="170" y="368" font-size="22" class="dt3" text-anchor="middle">all in the valence band</text>
  <!-- right: warmer, a few electrons jump the gap and leave holes -->
  <rect x="354" y="10" width="236" height="90" class="dfy" fill-opacity=".32"/>
  <path d="M354 44H590M354 74H590" class="ds3" stroke-width="2"/>
  <path d="M354 100H590" class="ds" stroke-width="4"/>
  <text x="348" y="108" font-size="22" font-weight="700" class="dt" text-anchor="end">E₀</text>
  <g class="dfr"><circle cx="384" cy="44" r="9"/><circle cx="412" cy="44" r="9"/><circle cx="530" cy="74" r="9"/><circle cx="558" cy="74" r="9"/></g>
  <path d="M452 116V186" class="ds" stroke-width="3.5"/><path d="M443 118 452 104 461 118zM443 184 452 198 461 184z" class="dfw"/>
  <text x="468" y="162" font-size="26" font-weight="700" class="dt">E<tspan font-size="18" dy="6">g</tspan></text>
  <rect x="354" y="202" width="236" height="100" class="dfb" fill-opacity=".32"/>
  <path d="M354 202H590" class="ds" stroke-width="2.5"/>
  <path d="M354 236H590M354 270H590" class="ds3" stroke-width="2"/>
  <text x="348" y="210" font-size="22" font-weight="700" class="dt" text-anchor="end">Eᵥ</text>
  <g class="df ds" stroke-width="3"><circle cx="508" cy="202" r="9"/><circle cx="536" cy="202" r="9"/><circle cx="382" cy="236" r="9"/><circle cx="410" cy="236" r="9"/></g>
  <g class="dfr">
    <circle cx="512" cy="270" r="9"/><circle cx="540" cy="270" r="9"/>
    <circle cx="412" cy="290" r="9"/><circle cx="440" cy="290" r="9"/>
  </g>
  <text x="472" y="340" font-size="24" font-weight="700" class="dt" text-anchor="middle">Heated</text>
  <text x="472" y="368" font-size="22" class="dt3" text-anchor="middle">some jump the gap</text>
  <!-- legend -->
  <g transform="translate(20 414)">
    <circle cx="10" cy="0" r="9" class="dfr"/><text x="28" y="8" font-size="22" class="dt2">electron</text>
    <circle cx="150" cy="0" r="9" class="df ds" stroke-width="3"/><text x="168" y="8" font-size="22" class="dt2">hole</text>
    <path d="M262 14V-12" class="ds2" stroke-width="3"/><path d="M254 -8 262 -20 270 -8z" class="dfd"/><text x="280" y="8" font-size="22" class="dt2">electron energy</text>
  </g>
</svg>
