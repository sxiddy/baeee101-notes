<text x="20" y="34" font-size="26" class="dt" font-weight="600">Rod earthing</text><rect x="20" y="140" width="560" height="380" class="ds3 dfo" stroke-width="2.5" fill-opacity=".08"/><line x1="20" y1="140" x2="580" y2="140" class="ds" stroke-width="3" fill="none"/><text x="580" y="130" font-size="20" class="dt2" text-anchor="end">Ground level</text><rect x="240" y="110" width="120" height="40" class="ds df2" stroke-width="2.5"/><text x="370" y="102" font-size="20" class="dt">Inspection pit and cover</text><rect x="292" y="130" width="16" height="370" class="dsy dfy" stroke-width="2.5" fill-opacity=".5"/><polygon points="292 500 308 500 300 525" class="dsy dfy" stroke-width="2.5" fill-opacity=".5" stroke-linejoin="round"/><rect x="286" y="136" width="28" height="14" class="ds df2" stroke-width="2.5"/><text x="325" y="168" font-size="20" class="dt">Clamp</text><polyline points="60 80 200 80 200 143 286 143" class="dsg" stroke-width="3" fill="none" stroke-linejoin="round"/><text x="60" y="70" font-size="20" class="dtg">Earth wire from installation</text><line x1="420" y1="150" x2="420" y2="500" class="ds2" stroke-width="1.8" marker-end="url(#aw)" marker-start="url(#aw)" fill="none"/><text x="430" y="330" font-size="22" class="dt">2.5–3 m</text><text x="150" y="330" font-size="22" class="dty" text-anchor="middle">Copper or GI rod</text><text x="150" y="356" font-size="20" class="dty" text-anchor="middle">12–25 mm dia</text><line x1="220" y1="340" x2="288" y2="340" class="dsy" stroke-width="2.5" marker-end="url(#ay)" fill="none"/><text x="150" y="440" font-size="20" class="dt2" text-anchor="middle">Moist soil</text><text x="20" y="550" font-size="20" class="dt3">Driven straight in: no pit to dig, so cheap and quick</text>
