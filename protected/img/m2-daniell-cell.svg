<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 610">
  <defs><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfb"/></marker></defs>
  <!-- wire and voltmeter -->
  <path d="M100 196V74H266M334 74H500V196" fill="none" class="ds2" stroke-width="3.5"/>
  <circle cx="300" cy="74" r="34" class="df2 ds" stroke-width="3.5"/>
  <path d="M277 80a24 24 0 0 1 46 0" fill="none" class="ds2" stroke-width="2.5"/>
  <path d="M300 86 288 62" class="ds" stroke-width="3"/>
  <text x="300" y="104" text-anchor="middle" font-size="22" font-weight="700" class="dt">V</text>
  <!-- electrons flow Zn -> Cu through the wire -->
  <path d="M128 40h80" class="dsb" stroke-width="4" marker-end="url(#ab)"/><path d="M392 40h80" class="dsb" stroke-width="4" marker-end="url(#ab)"/>
  <text x="160" y="28" text-anchor="middle" font-size="26" class="dtb">e⁻</text>
  <text x="432" y="28" text-anchor="middle" font-size="26" class="dtb">e⁻</text>
  <!-- beakers and solutions -->
  <path d="M32 324H248V424q0 22-22 22H54q-22 0-22-22z" class="dfd" fill-opacity=".22"/>
  <path d="M352 324H568V424q0 22-22 22H374q-22 0-22-22z" class="dfb" fill-opacity=".26"/>
  <path d="M30 250V424q0 24 24 24H226q24 0 24-24V250M350 250V424q0 24 24 24H546q24 0 24-24V250" fill="none" class="ds2" stroke-width="3.5"/>
  <!-- electrodes -->
  <rect x="86" y="196" width="28" height="232" rx="3" class="dfd"/>
  <rect x="486" y="196" width="28" height="232" rx="3" class="dfo"/>
  <text x="126" y="296" font-size="30" font-weight="700" class="dt">Zn</text>
  <text x="474" y="296" font-size="30" font-weight="700" class="dt" text-anchor="end">Cu</text>
  <text x="100" y="184" text-anchor="middle" font-size="36" font-weight="700" class="dt">−</text>
  <text x="500" y="186" text-anchor="middle" font-size="34" font-weight="700" class="dt">+</text>
  <!-- salt bridge -->
  <path d="M214 390V226q0-16 16-16H370q16 0 16 16V390" fill="none" class="ds2" stroke-width="28" stroke-linecap="round" stroke-opacity=".3"/>
  <path d="M214 390V226q0-16 16-16H370q16 0 16 16V390" fill="none" class="ds2" stroke-width="2.5"/>
  <text x="300" y="186" text-anchor="middle" font-size="24" class="dt">salt bridge (KCl)</text>
  <text x="158" y="428" text-anchor="middle" font-size="24" class="dt">ZnSO₄</text>
  <text x="438" y="428" text-anchor="middle" font-size="24" class="dt">CuSO₄</text>
  <!-- electrodes' jobs, half reactions (zinc releases electrons), cell notation -->
  <text x="140" y="486" text-anchor="middle" font-size="24" font-weight="700" class="dt">Anode (oxidation)</text>
  <text x="460" y="486" text-anchor="middle" font-size="24" font-weight="700" class="dt">Cathode (reduction)</text>
  <text x="140" y="522" text-anchor="middle" font-size="24" class="dt2">Zn → Zn²⁺ + 2e⁻</text>
  <text x="460" y="522" text-anchor="middle" font-size="24" class="dt2">Cu²⁺ + 2e⁻ → Cu</text>
  <text x="300" y="584" text-anchor="middle" font-size="24" class="dt">Zn | ZnSO₄ ‖ CuSO₄ | Cu</text>
</svg>
