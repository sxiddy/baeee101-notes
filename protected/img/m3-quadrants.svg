<text x="20" y="32" font-size="24" class="dt">The four quadrants (seen from the side)</text><line x1="300" y1="60" x2="300" y2="360" class="dsb" stroke-width="3" fill="none"/><line x1="70" y1="210" x2="530" y2="210" class="dsg" stroke-width="3" fill="none"/><text x="308" y="76" font-size="22" class="dtb" font-weight="700">VP</text><text x="70" y="202" font-size="22" class="dtg" font-weight="700">HP</text><text x="420" y="100" font-size="22" class="dt" text-anchor="middle" font-weight="700">1st quadrant</text><text x="420" y="128" font-size="22" class="dt" text-anchor="middle">above HP</text><text x="420" y="156" font-size="22" class="dt" text-anchor="middle">in front of VP</text><text x="180" y="100" font-size="22" class="dt" text-anchor="middle" font-weight="700">2nd quadrant</text><text x="180" y="128" font-size="22" class="dt" text-anchor="middle">above HP</text><text x="180" y="156" font-size="22" class="dt" text-anchor="middle">behind VP</text><text x="180" y="260" font-size="22" class="dt" text-anchor="middle" font-weight="700">3rd quadrant</text><text x="180" y="288" font-size="22" class="dt" text-anchor="middle">below HP</text><text x="180" y="316" font-size="22" class="dt" text-anchor="middle">behind VP</text><text x="420" y="260" font-size="22" class="dt" text-anchor="middle" font-weight="700">4th quadrant</text><text x="420" y="288" font-size="22" class="dt" text-anchor="middle">below HP</text><text x="420" y="316" font-size="22" class="dt" text-anchor="middle">in front of VP</text><line x1="590" y1="386" x2="530" y2="386" class="dso" stroke-width="2.5" fill="none" marker-end="url(#ao)"/><text x="520" y="394" font-size="22" class="dto" text-anchor="end">Observer looks from the front</text>
