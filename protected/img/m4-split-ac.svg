<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
<defs><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfw"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfb"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfo"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfr"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfg"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfp"/></marker><marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfy"/></marker></defs>
<text x="20" y="34" font-size="26" class="dt" font-weight="600">Split air conditioner</text><rect x="30" y="70" width="250" height="380" class="ds2" stroke-width="2.5" fill="none" stroke-dasharray="10 6"/><text x="155" y="100" font-size="24" class="dtb" text-anchor="middle">Indoor (room)</text><rect x="320" y="70" width="250" height="380" class="ds2" stroke-width="2.5" fill="none" stroke-dasharray="10 6"/><text x="445" y="100" font-size="24" class="dtr" text-anchor="middle">Outdoor unit</text><rect x="60" y="130" width="190" height="80" rx="10" class="dsb dfb" stroke-width="2.5" fill-opacity=".18"/><text x="155" y="178" font-size="22" class="dt" text-anchor="middle">Evaporator coil</text><rect x="60" y="250" width="190" height="60" rx="10" class="ds df2" stroke-width="2.5"/><text x="155" y="288" font-size="22" class="dt" text-anchor="middle">Blower fan</text><line x1="155" y1="330" x2="155" y2="380" class="dsb" stroke-width="3" marker-end="url(#ab)" fill="none"/><text x="155" y="410" font-size="22" class="dtb" text-anchor="middle">cool, dry air</text><line x1="155" y1="520" x2="155" y2="470" class="dso" stroke-width="3" marker-end="url(#ao)" fill="none"/><text x="175" y="520" font-size="22" class="dto">warm room air in</text><rect x="350" y="130" width="190" height="70" rx="10" class="ds df2" stroke-width="2.5"/><text x="445" y="173" font-size="22" class="dt" text-anchor="middle">Compressor</text><rect x="350" y="240" width="190" height="80" rx="10" class="dsr dfr" stroke-width="2.5" fill-opacity=".18"/><text x="445" y="288" font-size="22" class="dt" text-anchor="middle">Condenser coil</text><rect x="350" y="350" width="190" height="50" rx="10" class="ds df2" stroke-width="2.5"/><text x="445" y="383" font-size="22" class="dt" text-anchor="middle">Condenser fan</text><line x1="445" y1="400" x2="445" y2="440" class="dsr" stroke-width="3" marker-end="url(#ar)" fill="none"/><text x="445" y="475" font-size="22" class="dtr" text-anchor="middle">heat out to air</text><polyline points="250 160 300 160 300 150 350 150" class="dsb" stroke-width="2.5" marker-end="url(#ab)" fill="none" stroke-linejoin="round"/><text x="300" y="128" font-size="22" class="dtb" text-anchor="middle">suction</text><line x1="445" y1="200" x2="445" y2="238" class="dsr" stroke-width="2.5" marker-end="url(#ar)" fill="none"/><polyline points="350 300 300 300 300 195 252 195" class="dso" stroke-width="2.5" marker-end="url(#ao)" fill="none" stroke-linejoin="round"/><text x="300" y="555" font-size="22" class="dt2" text-anchor="middle">capillary tube (expansion) sits in the</text><text x="300" y="583" font-size="22" class="dt2" text-anchor="middle">liquid line from condenser to evaporator</text>
</svg>
