<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470">
<defs><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfw"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfb"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfo"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfr"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfg"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfp"/></marker><marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfy"/></marker></defs>
<text x="20" y="34" font-size="26" class="dt" font-weight="600">Direct and indirect extrusion</text><text x="20" y="75" font-size="20" class="dt" font-weight="600">(a) Direct: ram and product move the same way</text><rect x="140" y="95" width="280" height="110" class="ds df2" stroke-width="2.5" fill-opacity=".4"/><rect x="150" y="115" width="200" height="70" class="dso dfo" stroke-width="2.5" fill-opacity=".3"/><text x="250" y="158" font-size="20" class="dto" text-anchor="middle">Billet</text><rect x="60" y="125" width="90" height="50" class="ds df3" stroke-width="2.5"/><text x="80" y="110" font-size="20" class="dt">Ram</text><line x1="30" y1="150" x2="58" y2="150" class="ds" stroke-width="3" marker-end="url(#aw)" fill="none"/><rect x="350" y="105" width="30" height="90" class="ds df3" stroke-width="2.5"/><text x="365" y="225" font-size="20" class="dt" text-anchor="middle">Die</text><rect x="380" y="135" width="140" height="30" class="dso dfo" stroke-width="2.5" fill-opacity=".3"/><line x1="525" y1="150" x2="575" y2="150" class="dso" stroke-width="3" marker-end="url(#ao)" fill="none"/><text x="250" y="225" font-size="20" class="dtr" text-anchor="middle">billet slides: friction</text><text x="20" y="285" font-size="20" class="dt" font-weight="600">(b) Indirect: hollow ram carries the die into the billet</text><rect x="140" y="305" width="280" height="110" class="ds df2" stroke-width="2.5" fill-opacity=".4"/><rect x="150" y="325" width="260" height="70" class="dso dfo" stroke-width="2.5" fill-opacity=".3"/><text x="300" y="368" font-size="20" class="dto" text-anchor="middle">Billet</text><rect x="410" y="315" width="14" height="90" class="ds df3" stroke-width="2.5"/><text x="470" y="340" font-size="20" class="dt" text-anchor="middle">closed</text><text x="470" y="364" font-size="20" class="dt" text-anchor="middle">end</text><rect x="150" y="325" width="25" height="70" class="ds df3" stroke-width="2.5"/><text x="160" y="440" font-size="20" class="dt" text-anchor="middle">Die</text><rect x="40" y="330" width="110" height="20" class="ds df3" stroke-width="2.5"/><rect x="40" y="370" width="110" height="20" class="ds df3" stroke-width="2.5"/><text x="20" y="300" font-size="20" class="dt">Hollow ram</text><rect x="40" y="350" width="135" height="20" class="dso dfo" stroke-width="2.5" fill-opacity=".3"/><line x1="36" y1="360" x2="10" y2="360" class="dso" stroke-width="3" marker-end="url(#ao)" fill="none"/><line x1="180" y1="450" x2="220" y2="450" class="ds" stroke-width="3" marker-end="url(#aw)" fill="none"/><text x="230" y="456" font-size="20" class="dt">ram moves in</text><text x="420" y="440" font-size="20" class="dtg" text-anchor="middle">no billet sliding</text>
</svg>
