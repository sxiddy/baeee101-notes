<text x="20" y="34" font-size="26" class="dt" font-weight="600">Single-phase induction motor</text><text x="20" y="80" font-size="20" class="dt" font-weight="600">(a) Pulsating field = two half fields turning opposite ways</text><line x1="150" y1="290" x2="150" y2="110" class="ds3" stroke-width="1.5" stroke-dasharray="6 5" fill="none"/><text x="150" y="312" font-size="20" class="dt2" text-anchor="middle">axis of winding</text><line x1="150" y1="200" x2="190" y2="143" class="dsb" stroke-width="3" marker-end="url(#ab)" fill="none"/><line x1="150" y1="200" x2="110" y2="143" class="dsr" stroke-width="3" marker-end="url(#ar)" fill="none"/><line x1="150" y1="200" x2="150" y2="85" class="dsg" stroke-width="4" marker-end="url(#ag)" fill="none"/><text x="245" y="160" font-size="20" class="dtb">φm/2</text><text x="10" y="160" font-size="20" class="dtr">φm/2</text><path d="M235 170 A90 90 0 0 0 210 130" class="dsb" stroke-width="2.5" fill="none" marker-end="url(#ab)" stroke-linejoin="round" stroke-linecap="round"/><path d="M65 170 A90 90 0 0 1 90 130" class="dsr" stroke-width="2.5" fill="none" marker-end="url(#ar)" stroke-linejoin="round" stroke-linecap="round"/><text x="320" y="160" font-size="20" class="dt">Equal and opposite</text><text x="320" y="186" font-size="20" class="dt">torques at standstill:</text><text x="320" y="212" font-size="20" class="dtr" font-weight="600">net starting torque 0</text><text x="320" y="250" font-size="20" class="dtg">Resultant (green) only</text><text x="320" y="276" font-size="20" class="dtg">grows and shrinks</text><text x="20" y="345" font-size="20" class="dt" font-weight="600">(b) Capacitor-start: auxiliary winding + C</text><circle cx="60" cy="480" r="26" class="ds" stroke-width="2.5" fill="none"/><path d="M44.4 480C50.9 461.8 57.4 461.8 60 480S69.1 498.2 75.6 480" class="ds" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="95" y="488" font-size="20" class="dt">230 V</text><line x1="60" y1="454" x2="60" y2="390" class="ds" stroke-width="2.5" fill="none"/><line x1="60" y1="390" x2="460" y2="390" class="ds" stroke-width="2.5" fill="none"/><line x1="60" y1="506" x2="60" y2="570" class="ds" stroke-width="2.5" fill="none"/><line x1="60" y1="570" x2="460" y2="570" class="ds" stroke-width="2.5" fill="none"/><line x1="200" y1="390" x2="200" y2="425" class="ds" stroke-width="2.5" fill="none"/><path d="M200 425 c 18 0 18 15 0 15 c 18 0 18 15 0 15 c 18 0 18 15 0 15 c 18 0 18 15 0 15" class="ds" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="200" y1="485" x2="200" y2="570" class="ds" stroke-width="2.5" fill="none"/><text x="225" y="450" font-size="20" class="dt">Main</text><text x="225" y="474" font-size="20" class="dt">winding</text><line x1="400" y1="390" x2="400" y2="405" class="ds" stroke-width="2.5" fill="none"/><line x1="385" y1="405" x2="415" y2="405" class="ds" stroke-width="3" fill="none"/><line x1="385" y1="415" x2="415" y2="415" class="ds" stroke-width="3" fill="none"/><text x="425" y="418" font-size="22" class="dtb">C</text><line x1="400" y1="415" x2="400" y2="440" class="ds" stroke-width="2.5" fill="none"/><circle cx="400" cy="440" r="4" class="dfw"/><line x1="400" y1="440" x2="420" y2="460" class="dso" stroke-width="3" fill="none"/><circle cx="400" cy="462" r="4" class="dfw"/><text x="428" y="456" font-size="20" class="dto">Centrifugal switch</text><line x1="400" y1="462" x2="400" y2="480" class="ds" stroke-width="2.5" fill="none"/><path d="M400 480 c 18 0 18 13 0 13 c 18 0 18 13 0 13 c 18 0 18 13 0 13" class="dsr" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="400" y1="519" x2="400" y2="570" class="ds" stroke-width="2.5" fill="none"/><text x="428" y="510" font-size="20" class="dtr">Auxiliary</text><text x="428" y="534" font-size="20" class="dtr">winding</text><text x="20" y="610" font-size="20" class="dt3">C makes I_aux lead I_main by about 90°: two-phase action</text>
