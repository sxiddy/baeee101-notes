<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 980">
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 10 5 0 10z" class="dfr"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 10 5 0 10z" class="dfg"/></marker>
  </defs>
  <!-- top: pull and crystal rotation -->
  <path d="M170 92V16" class="dsr" stroke-width="4" marker-end="url(#r)"/>
  <path d="M136 54a34 12 0 1 0 68 0" fill="none" class="dsr" stroke-width="3" marker-end="url(#r)"/>
  <!-- seed holder, seed, neck, crystal -->
  <rect x="158" y="96" width="24" height="26" rx="3" class="dfd"/>
  <rect x="165" y="122" width="10" height="56" class="dfb" fill-opacity=".7"/>
  <path d="M170 178V200" class="dsb" stroke-width="3"/>
  <path d="M170 200C150 206 124 216 120 240V380H220V240C216 216 190 206 170 200z" class="dfb" fill-opacity=".45"/>
  <path d="M170 200C150 206 124 216 120 240V380M220 380V240C216 216 190 206 170 200" fill="none" class="dsb" stroke-width="3"/>
  <!-- thermal shield (outer walls) -->
  <rect x="20" y="290" width="20" height="430" class="dfd" fill-opacity=".45"/>
  <rect x="300" y="290" width="20" height="430" class="dfd" fill-opacity=".45"/>
  <!-- heater -->
  <rect x="50" y="330" width="12" height="290" class="dfo" fill-opacity=".8"/>
  <rect x="278" y="330" width="12" height="290" class="dfo" fill-opacity=".8"/>
  <!-- susceptor, SiO2 crucible, melt -->
  <path d="M72 320V600Q72 628 100 628H240Q268 628 268 600V320H256V592Q256 616 232 616H108Q84 616 84 592V320z" class="dfd" fill-opacity=".6"/>
  <path d="M90 380V588Q90 610 112 610H228Q250 610 250 588V380z" class="dfb" fill-opacity=".18"/>
  <path d="M87 320V590Q87 613 110 613H230Q253 613 253 590V320" fill="none" class="dsy" stroke-width="5"/>
  <path d="M90 380H120M220 380H250" class="dsb" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="170" y="470" text-anchor="middle" font-size="24" font-weight="700" class="dt">Si melt</text>
  <!-- melt convection -->
  <path d="M130 590V510M170 590V500M210 590V510" class="dsr" stroke-width="3" marker-end="url(#r)"/>
  <!-- shaft -->
  <rect x="150" y="628" width="40" height="132" class="dfd" fill-opacity=".45"/>
  <!-- bottom: crucible lift and rotation -->
  <path d="M170 850V776" class="dsr" stroke-width="4" marker-end="url(#r)"/>
  <path d="M136 812a34 12 0 1 0 68 0" fill="none" class="dsr" stroke-width="3" marker-end="url(#r)"/>
  <!-- gas: argon in at the top, exhaust out at the bottom -->
  <text x="20" y="232" font-size="22" font-weight="700" class="dtg">Ar in</text>
  <path d="M60 244 102 300" class="dsg" stroke-width="3.5" marker-end="url(#g)"/>
  <path d="M110 640 110 700M230 640 230 700" class="dsg" stroke-width="3.5" marker-end="url(#g)"/>
  <!-- leaders -->
  <g class="ds3" stroke-width="2" fill="none">
    <path d="M338 108H184"/><path d="M338 152H176"/><path d="M338 196H174"/><path d="M338 262H212"/>
    <path d="M338 390H312"/><path d="M338 440H286"/><path d="M338 490H264"/><path d="M338 540H254"/>
    <path d="M338 670H234"/><path d="M338 730H192"/>
  </g>
  <g class="dfw"><circle cx="212" cy="262" r="4"/><circle cx="312" cy="390" r="4"/><circle cx="284" cy="440" r="4"/><circle cx="262" cy="490" r="4"/><circle cx="253" cy="540" r="4"/><circle cx="192" cy="730" r="4"/></g>
  <!-- labels -->
  <text x="236" y="40" font-size="24" font-weight="700" class="dtr">pull speed v</text>
  <text x="236" y="70" font-size="22" class="dtr">crystal rotation v₁</text>
  <g font-size="24" class="dt">
    <text x="346" y="116">Seed holder</text>
    <text x="346" y="160">Seed</text>
    <text x="346" y="204">Crystal neck</text>
    <text x="346" y="270" font-weight="700" class="dtb">Si single crystal</text>
    <text x="346" y="398">Thermal shield</text>
    <text x="346" y="448" class="dto">Heater</text>
    <text x="346" y="498">Crucible susceptor</text>
    <text x="346" y="548" class="dty">SiO₂ crucible</text>
    <text x="346" y="678" class="dtg">Ar + SiO + CO out</text>
    <text x="346" y="738">Crucible shaft</text>
  </g>
  <text x="236" y="806" font-size="24" font-weight="700" class="dtr">crucible lift rate</text>
  <text x="236" y="836" font-size="22" class="dtr">crucible rotation v₂</text>
  <!-- what else is controlled -->
  <path d="M0 872H600" class="ds3" stroke-width="2"/>
  <text x="14" y="906" font-size="22" class="dt2">Also controlled: temperature gradient,</text>
  <text x="14" y="938" font-size="22" class="dt2">crystal diameter, melt temperature and a</text>
  <text x="14" y="966" font-size="22" class="dt2">magnetic field that calms the melt</text>
</svg>
