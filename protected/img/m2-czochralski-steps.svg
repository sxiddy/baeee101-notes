<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 10 5 0 10z" class="dfd"/></marker>
  </defs>
  <!-- 1 melting -->
  <path d="M30 34V124H170V34" fill="none" class="ds2" stroke-width="3"/>
  <rect x="32" y="84" width="136" height="38" class="dfy" fill-opacity=".35"/>
  <path d="M60 84l10-18 12 8 8-14 14 12 10-10 12 14 8-6 6 14z" class="dfy" fill-opacity=".75"/>
  <path d="M100 6V48" class="ds2" stroke-width="5" marker-end="url(#a)"/>
  <text x="200" y="62" font-size="26" font-weight="700" class="dt">1  Melting</text>
  <text x="200" y="94" font-size="22" class="dt2">the solid charge melts</text>
  <path d="M0 140H600" class="ds3" stroke-width="2"/>
  <!-- 2 seed -->
  <path d="M30 174V264H170V174" fill="none" class="ds2" stroke-width="3"/>
  <rect x="32" y="214" width="136" height="48" class="dfy" fill-opacity=".35"/>
  <rect x="97" y="160" width="6" height="56" class="dfo"/>
  <path d="M80 186a20 7 0 1 0 40 0" fill="none" class="ds2" stroke-width="3" marker-end="url(#a)"/>
  <path d="M140 210V158" class="ds2" stroke-width="5" marker-end="url(#a)"/>
  <text x="200" y="202" font-size="26" font-weight="700" class="dt">2  Dipping the seed</text>
  <text x="200" y="234" font-size="22" class="dt2">rotating seed touches the melt</text>
  <path d="M0 280H600" class="ds3" stroke-width="2"/>
  <!-- 3 growth starts -->
  <path d="M30 314V404H170V314" fill="none" class="ds2" stroke-width="3"/>
  <rect x="32" y="354" width="136" height="48" class="dfy" fill-opacity=".35"/>
  <rect x="97" y="296" width="6" height="40" class="dfo"/>
  <path d="M100 334 118 356H82z" class="dfo"/>
  <path d="M80 318a20 7 0 1 0 40 0" fill="none" class="ds2" stroke-width="3" marker-end="url(#a)"/>
  <path d="M140 350V298" class="ds2" stroke-width="5" marker-end="url(#a)"/>
  <text x="200" y="342" font-size="26" font-weight="700" class="dt">3  Growth begins</text>
  <text x="200" y="374" font-size="22" class="dt2">crystal starts on the seed</text>
  <path d="M0 420H600" class="ds3" stroke-width="2"/>
  <!-- 4 pulling -->
  <path d="M30 454V544H170V454" fill="none" class="ds2" stroke-width="3"/>
  <rect x="32" y="510" width="136" height="32" class="dfy" fill-opacity=".35"/>
  <rect x="97" y="436" width="6" height="30" class="dfo"/>
  <path d="M100 462C84 470 70 490 68 512H132C130 490 116 470 100 462z" class="dfo"/>
  <path d="M80 452a20 7 0 1 0 40 0" fill="none" class="ds2" stroke-width="3" marker-end="url(#a)"/>
  <path d="M152 500V440" class="ds2" stroke-width="5" marker-end="url(#a)"/>
  <text x="200" y="482" font-size="26" font-weight="700" class="dt">4  Pulling</text>
  <text x="200" y="514" font-size="22" class="dt2">crystal is drawn up, rotating</text>
  <path d="M0 560H600" class="ds3" stroke-width="2"/>
  <!-- 5 cooling -->
  <path d="M30 594V684H170V594" fill="none" class="ds2" stroke-width="3"/>
  <rect x="32" y="670" width="136" height="12" class="dfy" fill-opacity=".35"/>
  <rect x="97" y="574" width="6" height="20" class="dfo"/>
  <path d="M100 590C80 596 70 612 70 630V648Q70 660 84 660H116Q130 660 130 648V630C130 612 120 596 100 590z" class="dfo"/>
  <path d="M152 640V580" class="ds2" stroke-width="5" marker-end="url(#a)"/>
  <text x="200" y="622" font-size="26" font-weight="700" class="dt">5  Cooling</text>
  <text x="200" y="654" font-size="22" class="dt2">finished boule lifted clear</text>
</svg>
