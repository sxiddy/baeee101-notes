<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540">
<defs><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfw"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfb"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfo"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfr"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfg"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfp"/></marker><marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfy"/></marker></defs>
<text x="20" y="34" font-size="26" class="dt" font-weight="600">Double-acting cylinder and Pascal's law</text><rect x="60" y="80" width="300" height="100" class="ds df2" stroke-width="2.5" fill-opacity=".3"/><rect x="170" y="85" width="24" height="90" class="ds df2" stroke-width="2.5"/><text x="182" y="205" font-size="22" class="dt" text-anchor="middle">Piston</text><rect x="194" y="120" width="280" height="20" class="ds df2" stroke-width="2.5"/><text x="480" y="115" font-size="22" class="dt">Rod →</text><rect x="62" y="82" width="108" height="96" class="dsb dfb" stroke-width="2.5" fill-opacity=".25"/><line x1="90" y1="220" x2="90" y2="182" class="dsb" stroke-width="3" marker-end="url(#ab)" fill="none"/><text x="90" y="245" font-size="20" class="dtb" text-anchor="middle">Port A: in</text><line x1="320" y1="182" x2="320" y2="220" class="ds2" stroke-width="3" marker-end="url(#aw)" fill="none"/><text x="320" y="245" font-size="20" class="dt2" text-anchor="middle">Port B: out</text><text x="20" y="285" font-size="20" class="dt3">Swap ports to retract: fluid pushes both ways</text><text x="20" y="330" font-size="24" class="dt" font-weight="600">Pascal: p = F₁/A₁ = F₂/A₂</text><path d="M80 360 L80 500 L520 500 L520 380 M140 360 L140 470 L400 470 L400 380" class="ds" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="82" y="395" width="56" height="75" class="dsb dfb" stroke-width="2.5" fill-opacity=".25"/><rect x="402" y="415" width="116" height="55" class="dsb dfb" stroke-width="2.5" fill-opacity=".25"/><rect x="140" y="470" width="380" height="28" class="dsb dfb" stroke-width="2.5" fill-opacity=".25"/><rect x="80" y="382" width="60" height="13" class="ds df2" stroke-width="2.5"/><rect x="400" y="402" width="120" height="13" class="ds df2" stroke-width="2.5"/><line x1="110" y1="345" x2="110" y2="380" class="dsr" stroke-width="3" marker-end="url(#ar)" fill="none"/><text x="150" y="360" font-size="20" class="dtr">small F₁, A₁</text><line x1="460" y1="400" x2="460" y2="360" class="dsg" stroke-width="3" marker-end="url(#ag)" fill="none"/><text x="450" y="352" font-size="20" class="dtg" text-anchor="end">large F₂, A₂</text><text x="270" y="530" font-size="20" class="dtb" text-anchor="middle">oil</text>
</svg>
