<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620">
<defs><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfw"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfb"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfo"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfr"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfg"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfp"/></marker><marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfy"/></marker></defs>
<text x="20" y="34" font-size="26" class="dt" font-weight="600">Types of constrained motion</text><text x="20" y="80" font-size="22" class="dt" font-weight="600">(a) Completely constrained</text><rect x="60" y="100" width="220" height="70" class="ds df2" stroke-width="2.5" fill-opacity=".4"/><rect x="70" y="115" width="340" height="40" class="dsb dfb" stroke-width="2.5" fill-opacity=".3"/><line x1="420" y1="135" x2="480" y2="135" class="dsb" stroke-width="2.5" marker-end="url(#ab)" marker-start="url(#ab)" fill="none"/><text x="300" y="200" font-size="20" class="dt2" text-anchor="middle">Square bar in a square hole: can only slide</text><text x="20" y="260" font-size="22" class="dt" font-weight="600">(b) Incompletely constrained</text><rect x="60" y="280" width="220" height="70" class="ds df2" stroke-width="2.5" fill-opacity=".4"/><rect x="70" y="300" width="340" height="30" rx="15" class="dso dfo" stroke-width="2.5" fill-opacity=".3"/><line x1="420" y1="315" x2="480" y2="315" class="dso" stroke-width="2.5" marker-end="url(#ao)" marker-start="url(#ao)" fill="none"/><path d="M500 290 A 25 25 0 1 1 500 340" class="dso" stroke-width="2.5" fill="none" marker-end="url(#ao)" stroke-linejoin="round" stroke-linecap="round"/><text x="300" y="380" font-size="20" class="dt2" text-anchor="middle">Round shaft in a round hole: slides and turns</text><text x="20" y="440" font-size="22" class="dt" font-weight="600">(c) Successfully constrained</text><rect x="240" y="470" width="40" height="110" class="dsg dfg" stroke-width="2.5" fill-opacity=".3"/><path d="M200 600 L200 540 L230 540 L230 590 L290 590 L290 540 L320 540 L320 600 Z" class="ds df2" stroke-width="2.5" fill-opacity=".5" stroke-linejoin="round" stroke-linecap="round"/><line x1="260" y1="455" x2="260" y2="475" class="dsr" stroke-width="3" marker-end="url(#ar)" fill="none"/><text x="272" y="458" font-size="20" class="dtr">Load W</text><path d="M330 500 A 30 14 0 1 1 330 520" class="dsg" stroke-width="2.5" fill="none" marker-end="url(#ag)" stroke-linejoin="round" stroke-linecap="round"/><text x="360" y="540" font-size="20" class="dt2">Foot-step bearing: load</text><text x="360" y="564" font-size="20" class="dt2">stops upward motion,</text><text x="360" y="588" font-size="20" class="dt2">so it only turns</text>
</svg>
