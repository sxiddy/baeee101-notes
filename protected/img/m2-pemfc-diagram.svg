<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 748">
  <defs>
    <marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 10 5 0 10z" class="dfy"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 10 5 0 10z" class="dfg"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 10 5 0 10z" class="dfr"/></marker>
    <marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 10 5 0 10z" class="dfw"/></marker>
  </defs>
  <!-- external circuit and load -->
  <path d="M214 130V56H256l6-12 12 24 12-24 12 24 12-24 12 24 6-12H386V130" fill="none" class="ds" stroke-width="3" stroke-linejoin="round"/>
  <text x="300" y="30" text-anchor="middle" font-size="24" font-weight="700" class="dt">LOAD</text>
  <path d="M196 116V76" class="dsy" stroke-width="4" marker-end="url(#y)"/>
  <path d="M404 76V116" class="dsy" stroke-width="4" marker-end="url(#y)"/>
  <text x="186" y="100" text-anchor="end" font-size="24" class="dty">e⁻</text>
  <text x="414" y="100" font-size="24" class="dty">e⁻</text>
  <!-- layers -->
  <rect x="20" y="130" width="20" height="270" class="dfd" fill-opacity=".7"/>
  <rect x="40" y="130" width="144" height="270" class="dfg" fill-opacity=".1"/>
  <rect x="184" y="130" width="60" height="270" class="dfd" fill-opacity=".4"/>
  <rect x="244" y="130" width="16" height="270" class="dfw" fill-opacity=".85"/>
  <rect x="260" y="130" width="80" height="270" class="dfb" fill-opacity=".35"/>
  <rect x="340" y="130" width="16" height="270" class="dfw" fill-opacity=".85"/>
  <rect x="356" y="130" width="60" height="270" class="dfd" fill-opacity=".4"/>
  <rect x="416" y="130" width="144" height="270" class="dfr" fill-opacity=".1"/>
  <rect x="560" y="130" width="20" height="270" class="dfd" fill-opacity=".7"/>
  <path d="M20 130H580M20 400H580" class="ds2" stroke-width="3"/>
  <!-- gases -->
  <text x="54" y="184" font-size="26" font-weight="700" class="dtg">H₂ in</text>
  <path d="M60 204H170" class="dsg" stroke-width="4" marker-end="url(#g)"/>
  <path d="M170 346H60" class="dsg" stroke-width="4" marker-end="url(#g)" stroke-dasharray="10 6"/>
  <text x="54" y="384" font-size="22" class="dtg">unused H₂</text>
  <text x="546" y="184" text-anchor="end" font-size="26" font-weight="700" class="dtr">O₂ in</text>
  <path d="M540 204H430" class="dsr" stroke-width="4" marker-end="url(#r)"/>
  <path d="M430 346H540" class="ds" stroke-width="4" marker-end="url(#w)"/>
  <text x="546" y="384" text-anchor="end" font-size="22" class="dt">H₂O, unused O₂</text>
  <!-- protons through the membrane -->
  <text x="300" y="196" text-anchor="middle" font-size="26" font-weight="700" class="dt">H⁺</text>
  <g class="ds" stroke-width="4"><path d="M266 230H330" marker-end="url(#w)"/><path d="M266 280H330" marker-end="url(#w)"/><path d="M266 330H330" marker-end="url(#w)"/></g>
  <!-- electrodes and reactions -->
  <text x="112" y="446" text-anchor="middle" font-size="26" font-weight="700" class="dt">Anode (−)</text>
  <text x="488" y="446" text-anchor="middle" font-size="26" font-weight="700" class="dt">Cathode (+)</text>
  <text x="14" y="480" font-size="22" class="dt2">H₂ → 2H⁺ + 2e⁻</text>
  <text x="586" y="480" text-anchor="end" font-size="22" class="dt2">½O₂ + 2H⁺ + 2e⁻ → H₂O</text>
  <!-- key to the layers, left to right -->
  <path d="M0 506H600" class="ds3" stroke-width="2"/>
  <rect x="14" y="522" width="34" height="26" class="dfd" fill-opacity=".7"/>
  <text x="62" y="543" font-size="24" class="dt">anode / cathode plate</text>
  <rect x="14" y="560" width="34" height="26" class="dfd" fill-opacity=".4"/>
  <text x="62" y="581" font-size="24" class="dt">gas diffusion layer</text>
  <rect x="14" y="598" width="34" height="26" class="dfw" fill-opacity=".85"/>
  <text x="62" y="619" font-size="24" class="dt">catalyst layer (H₂ splits here)</text>
  <rect x="14" y="636" width="34" height="26" class="dfb" fill-opacity=".35"/>
  <text x="62" y="657" font-size="24" class="dt">proton exchange membrane</text>
  <text x="14" y="700" font-size="22" class="dt3">Electrons can't cross the membrane,</text>
  <text x="14" y="730" font-size="22" class="dt3">so they go round through the load.</text>
</svg>
