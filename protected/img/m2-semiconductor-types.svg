<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 476">
  <rect x="170" y="8" width="260" height="58" rx="16" class="dfg" fill-opacity=".24"/>
  <rect x="170" y="8" width="260" height="58" rx="16" fill="none" class="dsg" stroke-width="3"/>
  <text x="300" y="46" text-anchor="middle" font-size="28" font-weight="700" class="dt">Semiconductor</text>
  <path d="M300 66v26M90 118V92H410V118M410 196v24M310 262V220H510V262M90 196v58" fill="none" class="ds2" stroke-width="3"/>
  <text x="90" y="146" text-anchor="middle" font-size="26" font-weight="700" class="dt">Intrinsic</text>
  <text x="90" y="176" text-anchor="middle" font-size="22" class="dt3">pure</text>
  <text x="410" y="146" text-anchor="middle" font-size="26" font-weight="700" class="dt">Extrinsic</text>
  <text x="410" y="176" text-anchor="middle" font-size="22" class="dt3">doped</text>
  <text x="90" y="290" text-anchor="middle" font-size="26" font-weight="700" class="dtb">Ge, Si</text>
  <text x="90" y="324" text-anchor="middle" font-size="22" class="dt2">nₑ = nₕ = nᵢ</text>
  <text x="310" y="292" text-anchor="middle" font-size="26" font-weight="700" class="dt">n-type</text>
  <text x="310" y="326" text-anchor="middle" font-size="22" class="dt2">pentavalent</text>
  <text x="310" y="354" text-anchor="middle" font-size="24" font-weight="700" class="dtb">P, As, Sb</text>
  <text x="310" y="388" text-anchor="middle" font-size="22" class="dt2">donor, N<tspan font-size="16" dy="6">D</tspan></text>
  <text x="310" y="428" text-anchor="middle" font-size="22" class="dt2">nₑ ≫ nₕ</text>
  <text x="310" y="458" text-anchor="middle" font-size="22" class="dt3">more electrons</text>
  <text x="510" y="292" text-anchor="middle" font-size="26" font-weight="700" class="dt">p-type</text>
  <text x="510" y="326" text-anchor="middle" font-size="22" class="dt2">trivalent</text>
  <text x="510" y="354" text-anchor="middle" font-size="24" font-weight="700" class="dtb">B, Al, Ga, In</text>
  <text x="510" y="388" text-anchor="middle" font-size="22" class="dt2">acceptor, N<tspan font-size="16" dy="6">A</tspan></text>
  <text x="510" y="428" text-anchor="middle" font-size="22" class="dt2">nₕ ≫ nₑ</text>
  <text x="510" y="458" text-anchor="middle" font-size="22" class="dt3">more holes</text>
</svg>
