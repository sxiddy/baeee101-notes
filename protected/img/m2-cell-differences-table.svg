<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1202">
  <text x="14" y="36" font-size="26" font-weight="700" class="dt">1  What it does</text>
  <text x="14" y="70" font-size="22" font-weight="700" class="dtb">Primary</text>
  <text x="150" y="70" font-size="22" class="dt2">galvanic only: makes electricity</text>
  <text x="14" y="104" font-size="22" font-weight="700" class="dto">Secondary</text>
  <text x="150" y="104" font-size="22" class="dt2">galvanic when discharging,</text>
  <text x="150" y="134" font-size="22" class="dt2">electrolytic when charging</text>
  <text x="14" y="168" font-size="22" font-weight="700" class="dtg">Fuel cell</text>
  <text x="150" y="168" font-size="22" class="dt2">galvanic: makes electricity</text>
  <path d="M0 180H600" class="ds3" stroke-width="2"/>
  <text x="14" y="216" font-size="26" font-weight="700" class="dt">2  Cell reaction</text>
  <text x="14" y="250" font-size="22" font-weight="700" class="dtb">Primary</text>
  <text x="150" y="250" font-size="22" class="dt2">not reversible</text>
  <text x="14" y="284" font-size="22" font-weight="700" class="dto">Secondary</text>
  <text x="150" y="284" font-size="22" class="dt2">reversible</text>
  <text x="14" y="318" font-size="22" font-weight="700" class="dtg">Fuel cell</text>
  <text x="150" y="318" font-size="22" class="dt2">runs one way, fuel is fed in</text>
  <path d="M0 330H600" class="ds3" stroke-width="2"/>
  <text x="14" y="366" font-size="26" font-weight="700" class="dt">3  Recharging</text>
  <text x="14" y="400" font-size="22" font-weight="700" class="dtb">Primary</text>
  <text x="150" y="400" font-size="22" class="dt2">can't be recharged</text>
  <text x="14" y="434" font-size="22" font-weight="700" class="dto">Secondary</text>
  <text x="150" y="434" font-size="22" class="dt2">can be recharged</text>
  <text x="14" y="468" font-size="22" font-weight="700" class="dtg">Fuel cell</text>
  <text x="150" y="468" font-size="22" class="dt2">gives energy continuously</text>
  <path d="M0 480H600" class="ds3" stroke-width="2"/>
  <text x="14" y="516" font-size="26" font-weight="700" class="dt">4  Life</text>
  <text x="14" y="550" font-size="22" font-weight="700" class="dtb">Primary</text>
  <text x="150" y="550" font-size="22" class="dt2">works while the active</text>
  <text x="150" y="580" font-size="22" class="dt2">materials last</text>
  <text x="14" y="614" font-size="22" font-weight="700" class="dto">Secondary</text>
  <text x="150" y="614" font-size="22" class="dt2">used again and again</text>
  <text x="150" y="644" font-size="22" class="dt2">by recharging</text>
  <text x="14" y="678" font-size="22" font-weight="700" class="dtg">Fuel cell</text>
  <text x="150" y="678" font-size="22" class="dt2">needs reactants fed in all</text>
  <text x="150" y="708" font-size="22" class="dt2">the time; stores no energy</text>
  <path d="M0 720H600" class="ds3" stroke-width="2"/>
  <text x="14" y="756" font-size="26" font-weight="700" class="dt">5  Examples</text>
  <text x="14" y="790" font-size="22" font-weight="700" class="dtb">Primary</text>
  <text x="150" y="790" font-size="22" class="dt2">Leclanché (dry) cell,</text>
  <text x="150" y="820" font-size="22" class="dt2">lithium cell</text>
  <text x="14" y="854" font-size="22" font-weight="700" class="dto">Secondary</text>
  <text x="150" y="854" font-size="22" class="dt2">lead storage, Ni–Cd,</text>
  <text x="150" y="884" font-size="22" class="dt2">lithium-ion</text>
  <text x="14" y="918" font-size="22" font-weight="700" class="dtg">Fuel cell</text>
  <text x="150" y="918" font-size="22" class="dt2">H₂–O₂ fuel cell,</text>
  <text x="150" y="948" font-size="22" class="dt2">CH₃OH–O₂ fuel cell</text>
  <path d="M0 960H600" class="ds3" stroke-width="2"/>
  <text x="14" y="996" font-size="26" font-weight="700" class="dt">6  Uses</text>
  <text x="14" y="1030" font-size="22" font-weight="700" class="dtb">Primary</text>
  <text x="150" y="1030" font-size="22" class="dt2">pacemakers, watches,</text>
  <text x="150" y="1060" font-size="22" class="dt2">transistors, radios</text>
  <text x="14" y="1094" font-size="22" font-weight="700" class="dto">Secondary</text>
  <text x="150" y="1094" font-size="22" class="dt2">electronics, vehicles,</text>
  <text x="150" y="1124" font-size="22" class="dt2">cameras, laptops, torches</text>
  <text x="14" y="1158" font-size="22" font-weight="700" class="dtg">Fuel cell</text>
  <text x="150" y="1158" font-size="22" class="dt2">spacecraft: light, and its</text>
  <text x="150" y="1188" font-size="22" class="dt2">product water is drunk</text>
</svg>
