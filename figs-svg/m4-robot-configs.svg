<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
<defs><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfw"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfb"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfo"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfr"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfg"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfp"/></marker><marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfy"/></marker></defs>
<text x="20" y="34" font-size="26" class="dt" font-weight="600">Robot arm configurations</text><rect x="10" y="60" width="280" height="220" rx="8" class="ds3" stroke-width="2.5" fill="none" stroke-dasharray="6 5"/><text x="150" y="90" font-size="22" class="dt" text-anchor="middle" font-weight="600">Cartesian</text><text x="150" y="265" font-size="20" class="dt2" text-anchor="middle">P P P: box workspace</text><rect x="40" y="100" width="220" height="16" class="ds df2" stroke-width="2.5"/><line x1="40" y1="108" x2="260" y2="108" class="dsb" stroke-width="2.5" marker-end="url(#ab)" marker-start="url(#ab)" fill="none"/><rect x="140" y="116" width="20" height="40" class="ds df2" stroke-width="2.5"/><line x1="150" y1="120" x2="150" y2="180" class="dso" stroke-width="5" fill="none"/><line x1="150" y1="160" x2="150" y2="185" class="dso" stroke-width="2.5" marker-end="url(#ao)" fill="none"/><line x1="170" y1="140" x2="220" y2="140" class="dsr" stroke-width="2.5" marker-end="url(#ar)" fill="none"/><text x="200" y="132" font-size="20" class="dtr">z</text><text x="60" y="95" font-size="20" class="dtb">x</text><text x="130" y="175" font-size="20" class="dto">y</text><rect x="310" y="60" width="280" height="220" rx="8" class="ds3" stroke-width="2.5" fill="none" stroke-dasharray="6 5"/><text x="450" y="90" font-size="22" class="dt" text-anchor="middle" font-weight="600">Cylindrical</text><text x="450" y="265" font-size="20" class="dt2" text-anchor="middle">R P P: cylinder workspace</text><rect x="420" y="170" width="60" height="14" class="ds df2" stroke-width="2.5"/><line x1="450" y1="170" x2="450" y2="105" class="ds" stroke-width="6" fill="none"/><rect x="440" y="115" width="20" height="24" class="dsb dfb" stroke-width="2.5" fill-opacity=".4"/><line x1="460" y1="127" x2="560" y2="127" class="dso" stroke-width="5" fill="none"/><line x1="540" y1="127" x2="575" y2="127" class="dso" stroke-width="2.5" marker-end="url(#ao)" fill="none"/><ellipse cx="450" cy="160" rx="40" ry="10" class="dsr" stroke-width="2.5" fill="none" stroke-dasharray="5 4"/><text x="500" y="165" font-size="20" class="dtr">turn</text><line x1="475" y1="135" x2="475" y2="108" class="dsb" stroke-width="2.5" marker-end="url(#ab)" fill="none"/><rect x="10" y="300" width="280" height="220" rx="8" class="ds3" stroke-width="2.5" fill="none" stroke-dasharray="6 5"/><text x="150" y="330" font-size="22" class="dt" text-anchor="middle" font-weight="600">Spherical (polar)</text><text x="150" y="505" font-size="20" class="dt2" text-anchor="middle">R R P: sphere-shell workspace</text><rect x="110" y="410" width="60" height="14" class="ds df2" stroke-width="2.5"/><line x1="140" y1="410" x2="140" y2="370" class="ds" stroke-width="6" fill="none"/><circle cx="140" cy="365" r="9" class="ds dfw" stroke-width="2.5"/><line x1="140" y1="365" x2="225" y2="345" class="dso" stroke-width="5" fill="none"/><line x1="215" y1="347" x2="250" y2="339" class="dso" stroke-width="2.5" marker-end="url(#ao)" fill="none"/><path d="M175 395 A 40 40 0 0 0 180 350" class="dsr" stroke-width="2.5" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)" stroke-linejoin="round" stroke-linecap="round"/><text x="60" y="385" font-size="20" class="dtr">tilt</text><ellipse cx="140" cy="418" rx="40" ry="10" class="dsb" stroke-width="2.5" fill="none" stroke-dasharray="5 4"/><rect x="310" y="300" width="280" height="220" rx="8" class="ds3" stroke-width="2.5" fill="none" stroke-dasharray="6 5"/><text x="450" y="330" font-size="22" class="dt" text-anchor="middle" font-weight="600">SCARA</text><text x="450" y="505" font-size="20" class="dt2" text-anchor="middle">R R P: arms in a horizontal plane</text><rect x="340" y="420" width="50" height="14" class="ds df2" stroke-width="2.5"/><line x1="365" y1="420" x2="365" y2="350" class="ds" stroke-width="6" fill="none"/><circle cx="365" cy="350" r="9" class="ds dfw" stroke-width="2.5"/><line x1="365" y1="350" x2="460" y2="350" class="dsb" stroke-width="5" fill="none"/><circle cx="460" cy="350" r="9" class="ds dfw" stroke-width="2.5"/><line x1="460" y1="350" x2="550" y2="350" class="dso" stroke-width="5" fill="none"/><circle cx="550" cy="350" r="9" class="ds dfw" stroke-width="2.5"/><line x1="550" y1="340" x2="550" y2="420" class="dsr" stroke-width="5" fill="none"/><line x1="550" y1="400" x2="550" y2="430" class="dsr" stroke-width="2.5" marker-end="url(#ar)" fill="none"/><text x="560" y="445" font-size="20" class="dtr">z</text><rect x="160" y="540" width="280" height="220" rx="8" class="ds3" stroke-width="2.5" fill="none" stroke-dasharray="6 5"/><text x="300" y="570" font-size="22" class="dt" text-anchor="middle" font-weight="600">Articulated (jointed arm)</text><text x="300" y="745" font-size="20" class="dt2" text-anchor="middle">R R R: like a human arm</text><rect x="220" y="700" width="60" height="14" class="ds df2" stroke-width="2.5"/><line x1="250" y1="700" x2="250" y2="655" class="ds" stroke-width="6" fill="none"/><circle cx="250" cy="650" r="9" class="ds dfw" stroke-width="2.5"/><line x1="250" y1="650" x2="320" y2="605" class="dsb" stroke-width="5" fill="none"/><circle cx="320" cy="605" r="9" class="ds dfw" stroke-width="2.5"/><line x1="320" y1="605" x2="400" y2="655" class="dso" stroke-width="5" fill="none"/><circle cx="400" cy="655" r="9" class="ds dfw" stroke-width="2.5"/><text x="240" y="640" font-size="20" class="dt2" text-anchor="end">shoulder</text><text x="335" y="600" font-size="20" class="dt2">elbow</text><text x="410" y="690" font-size="20" class="dt2">wrist</text><text x="20" y="790" font-size="20" class="dt3">P = prismatic (sliding) joint, R = revolute (turning) joint</text>
</svg>
