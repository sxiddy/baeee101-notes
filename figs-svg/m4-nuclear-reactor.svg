<text x="20" y="34" font-size="26" class="dt" font-weight="600">Nuclear reactor (pressurised water type)</text><rect x="60" y="90" width="250" height="330" rx="20" class="ds df2" stroke-width="2.5" fill-opacity=".4"/><text x="185" y="452" font-size="20" class="dt" text-anchor="middle">Pressure vessel</text><rect x="100" y="200" width="170" height="180" class="dsb dfb" stroke-width="2.5" fill-opacity=".15"/><text x="185" y="500" font-size="20" class="dtb" text-anchor="middle">Water: moderator and coolant</text><rect x="117" y="220" width="16" height="140" class="dso dfo" stroke-width="2.5" fill-opacity=".6"/><rect x="157" y="220" width="16" height="140" class="dso dfo" stroke-width="2.5" fill-opacity=".6"/><rect x="197" y="220" width="16" height="140" class="dso dfo" stroke-width="2.5" fill-opacity=".6"/><rect x="237" y="220" width="16" height="140" class="dso dfo" stroke-width="2.5" fill-opacity=".6"/><text x="185" y="476" font-size="20" class="dto" text-anchor="middle">Fuel rods (U-235)</text><line x1="145" y1="120" x2="145" y2="290" class="ds2" stroke-width="5" fill="none"/><line x1="185" y1="120" x2="185" y2="290" class="ds2" stroke-width="5" fill="none"/><line x1="225" y1="120" x2="225" y2="290" class="ds2" stroke-width="5" fill="none"/><line x1="130" y1="120" x2="240" y2="120" class="ds" stroke-width="4" fill="none"/><text x="185" y="110" font-size="20" class="dt" text-anchor="middle">Control rods (B, Cd)</text><rect x="50" y="80" width="270" height="350" rx="26" class="dsy" stroke-width="2.5" fill="none" stroke-dasharray="8 6"/><text x="20" y="70" font-size="20" class="dty">Shielding (concrete)</text><rect x="400" y="120" width="160" height="130" rx="10" class="ds df2" stroke-width="2.5"/><text x="480" y="180" font-size="22" class="dt" text-anchor="middle">Steam</text><text x="480" y="206" font-size="22" class="dt" text-anchor="middle">generator</text><polyline points="310 160 400 160" class="dsr" stroke-width="3" marker-end="url(#ar)" fill="none" stroke-linejoin="round"/><text x="355" y="150" font-size="20" class="dtr" text-anchor="middle">hot</text><polyline points="400 230 310 230" class="dsb" stroke-width="3" marker-end="url(#ab)" fill="none" stroke-linejoin="round"/><text x="355" y="222" font-size="20" class="dtb" text-anchor="middle">pump</text><line x1="480" y1="120" x2="480" y2="70" class="dso" stroke-width="3" marker-end="url(#ao)" fill="none"/><text x="480" y="58" font-size="20" class="dto" text-anchor="middle">steam to turbine</text><text x="20" y="540" font-size="20" class="dt3">Fission heat → coolant → steam → turbine → generator</text>
