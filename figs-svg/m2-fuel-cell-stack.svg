<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 596">
  <!-- box in 3-D: top, long side, end -->
  <path d="M60 130 360 70 560 140 260 200z" class="df3 ds2" stroke-width="3" stroke-linejoin="round"/>
  <path d="M260 200 560 140V300L260 360z" class="df2 ds2" stroke-width="3" stroke-linejoin="round"/>
  <path d="M60 130 260 200V360L60 290z" class="df ds2" stroke-width="3" stroke-linejoin="round"/>
  <!-- terminals on the long side -->
  <rect x="300" y="224" width="44" height="40" rx="5" class="dfr" fill-opacity=".85"/>
  <rect x="470" y="192" width="44" height="40" rx="5" class="dfd" fill-opacity=".85"/>
  <text x="322" y="252" text-anchor="middle" font-size="26" font-weight="700" class="dt">+</text>
  <text x="492" y="220" text-anchor="middle" font-size="26" font-weight="700" class="dt">−</text>
  <!-- gas and coolant ports on the end -->
  <g class="dfb" fill-opacity=".8"><circle cx="110" cy="222" r="15"/><circle cx="160" cy="240" r="15"/><circle cx="210" cy="258" r="15"/></g>
  <!-- legend -->
  <text x="14" y="36" font-size="28" font-weight="700" class="dt">Fuel cell stack module</text>
  <path d="M0 420H600" class="ds3" stroke-width="2"/>
  <rect x="14" y="440" width="30" height="26" rx="4" class="dfr" fill-opacity=".85"/>
  <text x="58" y="461" font-size="24" class="dt">+ terminal: DC power out</text>
  <rect x="14" y="478" width="30" height="26" rx="4" class="dfd" fill-opacity=".85"/>
  <text x="58" y="499" font-size="24" class="dt">− terminal</text>
  <circle cx="29" cy="529" r="13" class="dfb" fill-opacity=".8"/>
  <text x="58" y="537" font-size="24" class="dt">H₂, air and coolant ports</text>
  <text x="14" y="580" font-size="22" class="dt3">Inside: many cells joined in series</text>
</svg>
