<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 930">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfb"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 10 5 0 10z" class="dfo"/></marker>
  </defs>
  <!-- ===== CHARGING ===== -->
  <text x="14" y="34" font-size="28" font-weight="700" class="dt">Charging</text>
  <path d="M85 100V60H270M330 60H515V100" fill="none" class="ds2" stroke-width="3"/>
  <rect x="270" y="40" width="60" height="40" rx="6" class="df3 ds" stroke-width="3"/>
  <text x="300" y="30" text-anchor="middle" font-size="22" class="dt2">charger</text>
  <path d="M470 44H380" class="dsb" stroke-width="4" marker-end="url(#b)"/>
  <text x="486" y="52" font-size="24" class="dtb">e⁻</text>
  <!-- cell -->
  <rect x="40" y="100" width="90" height="230" class="dfd" fill-opacity=".55"/>
  <rect x="130" y="100" width="10" height="230" class="dfg" fill-opacity=".55"/>
  <rect x="140" y="100" width="320" height="230" class="dfb" fill-opacity=".14"/>
  <rect x="460" y="100" width="10" height="230" class="dfg" fill-opacity=".55"/>
  <rect x="470" y="100" width="90" height="230" class="dfr" fill-opacity=".45"/>
  <rect x="40" y="100" width="520" height="230" fill="none" class="ds2" stroke-width="3"/>
  <text x="85" y="150" text-anchor="middle" font-size="36" font-weight="700" class="dt">−</text>
  <text x="515" y="150" text-anchor="middle" font-size="36" font-weight="700" class="dt">+</text>
  <text x="300" y="136" text-anchor="middle" font-size="24" class="dt">electrolyte</text>
  <text x="146" y="136" font-size="22" class="dtg">SEI</text>
  <text x="454" y="136" text-anchor="end" font-size="22" class="dtg">SEI</text>
  <text x="300" y="178" text-anchor="middle" font-size="24" font-weight="700" class="dto">Li⁺</text>
  <g class="dso" stroke-width="4"><path d="M440 200H170" marker-end="url(#o)"/><path d="M440 250H170" marker-end="url(#o)"/><path d="M440 300H170" marker-end="url(#o)"/></g>
  <text x="85" y="366" text-anchor="middle" font-size="24" font-weight="700" class="dt">graphite</text>
  <text x="515" y="366" text-anchor="middle" font-size="24" font-weight="700" class="dt">LiCoO₂</text>
  <text x="14" y="406" font-size="22" class="dt2">C₆ + Li⁺ + e⁻ → LiC₆</text>
  <text x="586" y="406" text-anchor="end" font-size="22" class="dt3">reduction</text>
  <text x="14" y="438" font-size="22" class="dt2">LiCoO₂ → CoO₂ + Li⁺ + e⁻</text>
  <text x="586" y="438" text-anchor="end" font-size="22" class="dt3">oxidation</text>
  <path d="M0 462H600" class="ds3" stroke-width="2"/>
  <!-- ===== DISCHARGING ===== -->
  <text x="14" y="500" font-size="28" font-weight="700" class="dt">Discharging</text>
  <path d="M85 566V526H280M320 526H515V566" fill="none" class="ds2" stroke-width="3"/>
  <circle cx="300" cy="522" r="20" class="dfy" fill-opacity=".6"/>
  <circle cx="300" cy="522" r="20" fill="none" class="dsy" stroke-width="3"/>
  <text x="270" y="514" text-anchor="end" font-size="22" class="dt2">bulb</text>
  <path d="M380 510H470" class="dsb" stroke-width="4" marker-end="url(#b)"/>
  <text x="486" y="518" font-size="24" class="dtb">e⁻</text>
  <!-- cell -->
  <rect x="40" y="566" width="90" height="230" class="dfd" fill-opacity=".55"/>
  <rect x="130" y="566" width="10" height="230" class="dfg" fill-opacity=".55"/>
  <rect x="140" y="566" width="320" height="230" class="dfb" fill-opacity=".14"/>
  <rect x="460" y="566" width="10" height="230" class="dfg" fill-opacity=".55"/>
  <rect x="470" y="566" width="90" height="230" class="dfr" fill-opacity=".45"/>
  <rect x="40" y="566" width="520" height="230" fill="none" class="ds2" stroke-width="3"/>
  <text x="85" y="616" text-anchor="middle" font-size="36" font-weight="700" class="dt">−</text>
  <text x="515" y="616" text-anchor="middle" font-size="36" font-weight="700" class="dt">+</text>
  <text x="300" y="602" text-anchor="middle" font-size="24" class="dt">electrolyte</text>
  <text x="146" y="602" font-size="22" class="dtg">SEI</text>
  <text x="454" y="602" text-anchor="end" font-size="22" class="dtg">SEI</text>
  <text x="300" y="644" text-anchor="middle" font-size="24" font-weight="700" class="dto">Li⁺</text>
  <g class="dso" stroke-width="4"><path d="M160 666H430" marker-end="url(#o)"/><path d="M160 716H430" marker-end="url(#o)"/><path d="M160 766H430" marker-end="url(#o)"/></g>
  <text x="85" y="832" text-anchor="middle" font-size="24" font-weight="700" class="dt">graphite</text>
  <text x="515" y="832" text-anchor="middle" font-size="24" font-weight="700" class="dt">CoO₂</text>
  <text x="14" y="872" font-size="22" class="dt2">LiC₆ → C₆ + Li⁺ + e⁻</text>
  <text x="586" y="872" text-anchor="end" font-size="22" class="dt3">oxidation</text>
  <text x="14" y="904" font-size="22" class="dt2">CoO₂ + Li⁺ + e⁻ → LiCoO₂</text>
  <text x="586" y="904" text-anchor="end" font-size="22" class="dt3">reduction</text>
</svg>
