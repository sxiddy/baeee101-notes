<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 726">
  <!-- A, B, C -->
  <text x="14" y="34" font-size="26" font-weight="700" class="dt">A  Photosynthesis</text>
  <text x="586" y="34" text-anchor="end" font-size="24" font-weight="700" class="dtg">η 2–4%</text>
  <text x="50" y="64" font-size="22" class="dt2">plants · visible light</text>
  <text x="14" y="110" font-size="26" font-weight="700" class="dt">B  Water heaters</text>
  <text x="50" y="140" font-size="22" class="dt2">flat plate, tube · IR radiation</text>
  <text x="14" y="186" font-size="26" font-weight="700" class="dt">C  Photovoltaic cells</text>
  <text x="586" y="186" text-anchor="end" font-size="24" font-weight="700" class="dtg">η 12–26%</text>
  <text x="50" y="216" font-size="22" class="dt2">p/n Si, Si, GaAs · visible light</text>
  <!-- D and its branches -->
  <text x="14" y="262" font-size="26" font-weight="700" class="dtr">D  Chemical routes</text>
  <g fill="none" class="dsr" stroke-width="3">
    <path d="M30 272V376M30 300H52M30 376H52"/>
    <path d="M76 394V546M76 422H98M76 546H98"/>
    <path d="M120 440V500M120 464H134M120 500H134"/>
    <path d="M120 592V660M120 618H134M120 660H134"/>
  </g>
  <text x="60" y="308" font-size="24" font-weight="700" class="dt">D1  Biomimetism</text>
  <text x="96" y="338" font-size="22" class="dt2">mimics photosynthesis with chemicals</text>
  <text x="60" y="384" font-size="24" font-weight="700" class="dt">D2  PEC cells</text>
  <text x="106" y="430" font-size="24" font-weight="700" class="dt">a  LJSC</text>
  <text x="206" y="430" font-size="22" class="dt3">liquid-junction cells</text>
  <text x="140" y="472" font-size="22" class="dt">(i) Sc/Elect/M</text>
  <text x="586" y="472" text-anchor="end" font-size="22" font-weight="700" class="dtg">η 13–14%</text>
  <text x="140" y="508" font-size="22" class="dt">(ii) Photogalvanic M/Elect/M</text>
  <text x="586" y="508" text-anchor="end" font-size="22" font-weight="700" class="dtg">η 0.01%</text>
  <text x="106" y="554" font-size="24" font-weight="700" class="dt">b  PES cells</text>
  <text x="140" y="584" font-size="22" class="dt3">photoelectrosynthesis</text>
  <text x="140" y="626" font-size="22" class="dt">(i) Photoassisted electrolysis</text>
  <text x="586" y="626" text-anchor="end" font-size="22" font-weight="700" class="dtg">η 13.3%</text>
  <text x="140" y="668" font-size="22" class="dt">(ii) Photoassisted electrosynthesis</text>
  <text x="176" y="704" font-size="22" class="dt2">CO₂ → CH₃OH,  N₂ → NH₃</text>
</svg>
