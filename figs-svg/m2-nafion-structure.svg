<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 580">
  <text x="300" y="30" text-anchor="middle" font-size="22" class="dt3">Teflon-like backbone</text>
  <!-- backbone: -[(CF2-CF2)x-CF-CF2]y- -->
  <text x="282" y="80" text-anchor="end" font-size="26" class="dt">–[(CF₂–CF₂)<tspan font-size="18" dy="8">x</tspan><tspan dy="-8">–</tspan></text>
  <text x="300" y="80" text-anchor="middle" font-size="26" font-weight="700" class="dt">CF</text>
  <text x="318" y="80" font-size="26" class="dt">–CF₂]<tspan font-size="18" dy="8">y</tspan><tspan dy="-8">–</tspan></text>
  <!-- side chain, drawn downward from the CF -->
  <g class="ds" stroke-width="2.5">
    <path d="M300 88V108"/><path d="M300 138V158"/><path d="M300 194V214"/><path d="M300 250V270"/><path d="M300 306V326"/><path d="M300 362V382"/><path d="M300 418V438"/>
  </g>
  <g font-size="26" class="dt" text-anchor="middle">
    <text x="300" y="132">O</text>
    <text x="300" y="186">CF₂</text>
    <text x="300" y="242">CF</text>
    <text x="300" y="298">O</text>
    <text x="300" y="354">CF₂</text>
    <text x="300" y="410">CF₂</text>
  </g>
  <text x="324" y="242" font-size="26" class="dt">–CF₃</text>
  <!-- repeat bracket z around -O-CF2-CF(CF3)- -->
  <path d="M258 102H246V260H258M402 102H414V260H402" fill="none" class="ds2" stroke-width="2.5"/>
  <text x="420" y="268" font-size="18" class="dt">z</text>
  <text x="200" y="300" text-anchor="end" font-size="22" class="dt3">side chain</text>
  <!-- acid head -->
  <rect x="236" y="440" width="128" height="46" rx="10" class="dfr" fill-opacity=".18"/>
  <text x="300" y="474" text-anchor="middle" font-size="28" font-weight="700" class="dtr">SO₃H</text>
  <text x="380" y="474" font-size="26" class="dtb">· x H₂O</text>
  <text x="300" y="530" text-anchor="middle" font-size="22" class="dt2">–SO₃H groups hand protons (H⁺)</text>
  <text x="300" y="560" text-anchor="middle" font-size="22" class="dt2">along through the bound water</text>
</svg>
