<text x="20" y="26" font-size="24" class="dt">Two systems of dimensioning</text><text x="145" y="56" font-size="22" class="dtb" text-anchor="middle" font-weight="700">Aligned</text><rect x="70" y="90" width="150" height="90" class="ds" fill="none" stroke-width="3"/><line x1="70" y1="184" x2="70" y2="226" class="dsb" stroke-width="1.8" fill="none"/><line x1="220" y1="184" x2="220" y2="226" class="dsb" stroke-width="1.8" fill="none"/><line x1="66" y1="90" x2="24" y2="90" class="dsb" stroke-width="1.8" fill="none"/><line x1="66" y1="180" x2="24" y2="180" class="dsb" stroke-width="1.8" fill="none"/><line x1="145" y1="216" x2="70" y2="216" class="dsb" stroke-width="1.8" fill="none" marker-end="url(#ab)"/><line x1="145" y1="216" x2="220" y2="216" class="dsb" stroke-width="1.8" fill="none" marker-end="url(#ab)"/><text x="145" y="208" font-size="22" class="dt" text-anchor="middle">50</text><line x1="34" y1="135" x2="34" y2="90" class="dsb" stroke-width="1.8" fill="none" marker-end="url(#ab)"/><line x1="34" y1="135" x2="34" y2="180" class="dsb" stroke-width="1.8" fill="none" marker-end="url(#ab)"/><text x="26" y="135" font-size="22" class="dt" text-anchor="middle" transform="rotate(-90 26 135)">30</text><text x="445" y="56" font-size="22" class="dtb" text-anchor="middle" font-weight="700">Unidirectional</text><rect x="370" y="90" width="150" height="90" class="ds" fill="none" stroke-width="3"/><line x1="370" y1="184" x2="370" y2="226" class="dsb" stroke-width="1.8" fill="none"/><line x1="520" y1="184" x2="520" y2="226" class="dsb" stroke-width="1.8" fill="none"/><line x1="366" y1="90" x2="324" y2="90" class="dsb" stroke-width="1.8" fill="none"/><line x1="366" y1="180" x2="324" y2="180" class="dsb" stroke-width="1.8" fill="none"/><line x1="425" y1="216" x2="370" y2="216" class="dsb" stroke-width="1.8" fill="none" marker-end="url(#ab)"/><line x1="465" y1="216" x2="520" y2="216" class="dsb" stroke-width="1.8" fill="none" marker-end="url(#ab)"/><text x="445" y="224" font-size="22" class="dt" text-anchor="middle">50</text><line x1="334" y1="119" x2="334" y2="90" class="dsb" stroke-width="1.8" fill="none" marker-end="url(#ab)"/><line x1="334" y1="151" x2="334" y2="180" class="dsb" stroke-width="1.8" fill="none" marker-end="url(#ab)"/><text x="334" y="143" font-size="22" class="dt" text-anchor="middle">30</text><text x="20" y="290" font-size="22" class="dt">Aligned: figures above the line, read from</text><text x="20" y="318" font-size="22" class="dt">the bottom or the right side.</text><text x="20" y="352" font-size="22" class="dto">Unidirectional: figures always horizontal,</text><text x="20" y="380" font-size="22" class="dto">in a break in the dimension line.</text>
