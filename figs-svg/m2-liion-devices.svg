  <rect x="326" y="170" width="106" height="68" rx="6" class="dfb" fill-opacity=".45"/>
  <rect x="326" y="170" width="106" height="68" rx="6" fill="none" class="dsb" stroke-width="3"/>
  <text x="379" y="214" text-anchor="middle" font-size="24" font-weight="700" class="dt">3.7 V</text>
