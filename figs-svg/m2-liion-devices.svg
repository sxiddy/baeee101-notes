  <rect x="40" y="162" width="70" height="84" rx="6" class="df3 ds2" stroke-width="3"/>
  <rect x="50" y="170" width="12" height="16" class="dfy"/><rect x="69" y="170" width="12" height="16" class="dfy"/><rect x="88" y="170" width="12" height="16" class="dfy"/>
  <text x="136" y="204" font-size="26" font-weight="700" class="dt">Camera</text>
