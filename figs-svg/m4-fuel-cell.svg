<text x="20" y="34" font-size="26" class="dt" font-weight="600">Hydrogen fuel cell (PEM)</text><rect x="110" y="150" width="100" height="280" class="dsb dfb" stroke-width="2.5" fill-opacity=".18"/><text x="160" y="455" font-size="22" class="dtb" text-anchor="middle">Anode (−)</text><rect x="250" y="150" width="100" height="280" class="dsy dfy" stroke-width="2.5" fill-opacity=".15"/><text x="300" y="455" font-size="22" class="dty" text-anchor="middle">Electrolyte</text><rect x="390" y="150" width="100" height="280" class="dsr dfr" stroke-width="2.5" fill-opacity=".15"/><text x="440" y="455" font-size="22" class="dtr" text-anchor="middle">Cathode (+)</text><line x1="20" y1="230" x2="105" y2="230" class="dsb" stroke-width="3" marker-end="url(#ab)" fill="none"/><text x="20" y="220" font-size="24" class="dtb">H₂ in</text><line x1="580" y1="230" x2="495" y2="230" class="dsr" stroke-width="3" marker-end="url(#ar)" fill="none"/><text x="580" y="220" font-size="24" class="dtr" text-anchor="end">O₂ in</text><line x1="495" y1="360" x2="580" y2="360" class="dsb" stroke-width="3" marker-end="url(#ab)" fill="none"/><text x="580" y="395" font-size="24" class="dtb" text-anchor="end">H₂O out</text><line x1="225" y1="260" x2="375" y2="260" class="dso" stroke-width="2.5" marker-end="url(#ao)" fill="none"/><line x1="225" y1="300" x2="375" y2="300" class="dso" stroke-width="2.5" marker-end="url(#ao)" fill="none"/><line x1="225" y1="340" x2="375" y2="340" class="dso" stroke-width="2.5" marker-end="url(#ao)" fill="none"/><text x="300" y="395" font-size="24" class="dto" text-anchor="middle">H⁺ →</text><polyline points="160 150 160 90 255 90" class="dsb" stroke-width="2.5" marker-end="url(#ab)" fill="none" stroke-linejoin="round"/><rect x="255" y="70" width="90" height="40" class="ds df2" stroke-width="2.5"/><text x="300" y="98" font-size="22" class="dt" text-anchor="middle">Load</text><polyline points="345 90 440 90 440 148" class="dsb" stroke-width="2.5" marker-end="url(#ab)" fill="none" stroke-linejoin="round"/><text x="300" y="60" font-size="22" class="dtb" text-anchor="middle">e⁻ through load</text><text x="20" y="500" font-size="24" class="dt mono">Anode: 2H₂ → 4H⁺ + 4e⁻</text><text x="20" y="532" font-size="24" class="dt mono">Cathode: O₂ + 4H⁺ + 4e⁻ → 2H₂O</text><text x="20" y="564" font-size="22" class="dt mono">Overall: 2H₂ + O₂ → 2H₂O + electricity + heat</text>
