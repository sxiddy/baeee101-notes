<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 762">
<defs><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfw"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfb"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfo"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfr"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dfg"/></marker></defs>
<text x="20" y="36" font-size="26" class="dt" font-weight="600">Electromagnetic spectrum</text><text x="24" y="80" font-size="22" class="dt2">Band</text><text x="250" y="80" font-size="22" class="dt2">Starts at</text><text x="430" y="80" font-size="22" class="dt2">Wavelength</text><rect x="14" y="94" width="572" height="38" class="dfb" fill-opacity="0.24" stroke="none"/><text x="24" y="122" font-size="24" class="dt">ELF</text><text x="250" y="122" font-size="24" class="dt">30 Hz</text><text x="430" y="122" font-size="24" class="dt2">10⁷ m</text><rect x="14" y="136" width="572" height="38" class="dfb" fill-opacity="0.14" stroke="none"/><text x="24" y="164" font-size="24" class="dt">VF</text><text x="250" y="164" font-size="24" class="dt">300 Hz</text><text x="430" y="164" font-size="24" class="dt2">10⁶ m</text><rect x="14" y="178" width="572" height="38" class="dfb" fill-opacity="0.24" stroke="none"/><text x="24" y="206" font-size="24" class="dt">VLF</text><text x="250" y="206" font-size="24" class="dt">3 kHz</text><text x="430" y="206" font-size="24" class="dt2">10⁵ m</text><rect x="14" y="220" width="572" height="38" class="dfb" fill-opacity="0.14" stroke="none"/><text x="24" y="248" font-size="24" class="dt">LF</text><text x="250" y="248" font-size="24" class="dt">30 kHz</text><text x="430" y="248" font-size="24" class="dt2">10⁴ m</text><rect x="14" y="262" width="572" height="38" class="dfb" fill-opacity="0.24" stroke="none"/><text x="24" y="290" font-size="24" class="dt">MF</text><text x="250" y="290" font-size="24" class="dt">300 kHz</text><text x="430" y="290" font-size="24" class="dt2">10³ m</text><rect x="14" y="304" width="572" height="38" class="dfb" fill-opacity="0.14" stroke="none"/><text x="24" y="332" font-size="24" class="dt">HF</text><text x="250" y="332" font-size="24" class="dt">3 MHz</text><text x="430" y="332" font-size="24" class="dt2">100 m</text><rect x="14" y="346" width="572" height="38" class="dfb" fill-opacity="0.24" stroke="none"/><text x="24" y="374" font-size="24" class="dt">VHF</text><text x="250" y="374" font-size="24" class="dt">30 MHz</text><text x="430" y="374" font-size="24" class="dt2">10 m</text><rect x="14" y="388" width="572" height="38" class="dfb" fill-opacity="0.14" stroke="none"/><text x="24" y="416" font-size="24" class="dt">UHF</text><text x="250" y="416" font-size="24" class="dt">300 MHz</text><text x="430" y="416" font-size="24" class="dt2">1 m</text><rect x="14" y="430" width="572" height="38" class="dfb" fill-opacity="0.24" stroke="none"/><text x="24" y="458" font-size="24" class="dt">SHF</text><text x="250" y="458" font-size="24" class="dt">3 GHz</text><text x="430" y="458" font-size="24" class="dt2">0.1 m</text><rect x="14" y="472" width="572" height="38" class="dfb" fill-opacity="0.14" stroke="none"/><text x="24" y="500" font-size="24" class="dt">EHF</text><text x="250" y="500" font-size="24" class="dt">30 GHz</text><text x="430" y="500" font-size="24" class="dt2">1 cm</text><rect x="14" y="514" width="572" height="38" class="dfy" fill-opacity="0.24" stroke="none"/><text x="24" y="542" font-size="24" class="dt">Infrared</text><text x="250" y="542" font-size="22" class="dt2">0.1 mm to 700 nm</text><rect x="14" y="556" width="572" height="38" class="dfy" fill-opacity="0.14" stroke="none"/><text x="24" y="584" font-size="24" class="dt">Visible light</text><text x="250" y="584" font-size="22" class="dt2">0.4 to 0.8 µm</text><rect x="14" y="598" width="572" height="38" class="dfy" fill-opacity="0.24" stroke="none"/><text x="24" y="626" font-size="24" class="dt">Ultraviolet</text><text x="250" y="626" font-size="22" class="dt2">4 to 400 nm</text><rect x="14" y="640" width="572" height="38" class="dfr" fill-opacity="0.14" stroke="none"/><text x="24" y="668" font-size="24" class="dt">X-rays, gamma rays</text><text x="250" y="668" font-size="22" class="dt2">cosmic rays</text><line x1="8" y1="94" x2="8" y2="508" class="dsb" stroke-width="3" fill="none"/><line x1="8" y1="514" x2="8" y2="634" class="dsy" stroke-width="3" fill="none"/><text x="24" y="710" font-size="22" class="dt2">EHF = millimetre waves</text><text x="24" y="738" font-size="22" class="dt2">Infrared, visible, ultraviolet = optical spectrum</text>
</svg>
