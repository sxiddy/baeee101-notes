<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560">
  <!-- medal -->
  <circle cx="84" cy="80" r="62" class="dfy" fill-opacity=".3"/>
  <circle cx="84" cy="80" r="62" fill="none" class="dsy" stroke-width="4"/>
  <circle cx="84" cy="80" r="50" fill="none" class="dsy" stroke-width="2"/>
  <text x="84" y="92" text-anchor="middle" font-size="30" font-weight="700" class="dty">2019</text>
  <text x="168" y="66" font-size="28" font-weight="700" class="dt">Nobel Prize</text>
  <text x="168" y="100" font-size="28" font-weight="700" class="dt">in Chemistry</text>
  <text x="168" y="134" font-size="22" class="dt2">for lithium-ion batteries</text>
  <!-- three laureates -->
  <rect x="10" y="170" width="580" height="116" rx="14" class="df2"/>
  <text x="30" y="210" font-size="26" font-weight="700" class="dt">John B. Goodenough</text>
  <text x="570" y="210" text-anchor="end" font-size="24" class="dtb">USA</text>
  <text x="30" y="244" font-size="22" class="dt2">LiCoO₂ cathode: a higher-voltage</text>
  <text x="30" y="272" font-size="22" class="dt2">oxide electrode</text>
  <rect x="10" y="300" width="580" height="116" rx="14" class="df2"/>
  <text x="30" y="340" font-size="26" font-weight="700" class="dt">M. Stanley Whittingham</text>
  <text x="570" y="340" text-anchor="end" font-size="24" class="dtb">UK</text>
  <text x="30" y="374" font-size="22" class="dt2">first lithium battery: Li⁺ slides</text>
  <text x="30" y="402" font-size="22" class="dt2">into a TiS₂ cathode</text>
  <rect x="10" y="430" width="580" height="116" rx="14" class="df2"/>
  <text x="30" y="470" font-size="26" font-weight="700" class="dt">Akira Yoshino</text>
  <text x="570" y="470" text-anchor="end" font-size="24" class="dtb">Japan</text>
  <text x="30" y="504" font-size="22" class="dt2">first commercial Li-ion cell,</text>
  <text x="30" y="532" font-size="22" class="dt2">carbon anode instead of Li metal</text>
</svg>
