  <path d="M0 436H600" class="ds3" stroke-width="2"/>
  <g font-size="24" class="dt">
    <text x="14" y="472"><tspan font-weight="700">1 </tspan> DC/DC converter</text>
    <text x="14" y="504"><tspan font-weight="700">2 </tspan> Electric traction motor</text>
    <text x="14" y="536"><tspan font-weight="700">3 </tspan> Power electronic controller</text>
