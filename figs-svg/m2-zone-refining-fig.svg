<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfw"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfo"/></marker>
  </defs>
  <!-- labels above -->
  <text x="300" y="30" text-anchor="middle" font-size="24" font-weight="700" class="dto">Circular heater H</text>
  <path d="M300 42V112" class="ds" stroke-width="3" marker-end="url(#a)"/>
  <text x="96" y="96" text-anchor="middle" font-size="24" font-weight="700" class="dtg">X: pure Ge</text>
  <text x="96" y="124" text-anchor="middle" font-size="22" class="dt2">recrystallised</text>
  <path d="M96 132V156" class="ds" stroke-width="3" marker-end="url(#a)"/>
  <text x="484" y="96" text-anchor="middle" font-size="24" font-weight="700" class="dt">Z: impure Ge</text>
  <text x="484" y="124" text-anchor="middle" font-size="22" class="dt2">rod</text>
  <path d="M484 132V156" class="ds" stroke-width="3" marker-end="url(#a)"/>
  <!-- rod: pure part, molten zone, impure part -->
  <rect x="30" y="164" width="240" height="76" class="dfg" fill-opacity=".22"/>
  <rect x="270" y="164" width="60" height="76" class="dfo" fill-opacity=".5"/>
  <rect x="330" y="164" width="250" height="76" class="dfd" fill-opacity=".3"/>
  <path d="M30 164H580M30 240H580" class="ds2" stroke-width="3"/>
  <ellipse cx="30" cy="202" rx="16" ry="38" class="df2 ds2" stroke-width="3"/>
  <path d="M580 164a16 38 0 0 1 0 76" fill="none" class="ds2" stroke-width="3"/>
  <!-- impurities: crowded in the molten zone, scattered in the impure rod -->
  <g class="dfr">
    <circle cx="280" cy="178" r="3.5"/><circle cx="296" cy="190" r="3.5"/><circle cx="314" cy="176" r="3.5"/><circle cx="286" cy="206" r="3.5"/><circle cx="306" cy="214" r="3.5"/><circle cx="320" cy="198" r="3.5"/><circle cx="278" cy="226" r="3.5"/><circle cx="298" cy="230" r="3.5"/><circle cx="318" cy="228" r="3.5"/><circle cx="292" cy="172" r="3.5"/>
  </g>
  <g class="dfr" fill-opacity=".55">
    <circle cx="360" cy="186" r="3"/><circle cx="398" cy="222" r="3"/><circle cx="436" cy="180" r="3"/><circle cx="470" cy="214" r="3"/><circle cx="510" cy="190" r="3"/><circle cx="548" cy="224" r="3"/><circle cx="380" cy="204" r="3"/><circle cx="530" cy="176" r="3"/>
  </g>
  <!-- ring heater around the molten zone -->
  <path d="M300 124a34 78 0 0 1 0 156" fill="none" class="dso" stroke-width="14"/>
  <path d="M300 124a34 78 0 0 0 0 156" fill="none" class="dso" stroke-width="14" stroke-opacity=".45"/>
  <text x="120" y="211" text-anchor="middle" font-size="26" font-weight="700" class="dt">X</text>
  <text x="460" y="211" text-anchor="middle" font-size="26" font-weight="700" class="dt">Z</text>
  <!-- molten zone label -->
  <path d="M300 342V290" class="ds" stroke-width="3" marker-end="url(#a)"/>
  <text x="300" y="372" text-anchor="middle" font-size="24" font-weight="700" class="dto">Y: molten zone</text>
  <text x="300" y="402" text-anchor="middle" font-size="22" class="dt2">collects the impurities</text>
  <!-- direction of travel -->
  <path d="M170 440H430" class="dso" stroke-width="4" marker-end="url(#o)"/>
  <text x="300" y="480" text-anchor="middle" font-size="22" class="dt2">heater, zone and impurities move to Z</text>
</svg>
