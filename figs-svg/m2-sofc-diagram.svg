<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 490">
  <defs>
    <marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 10 5 0 10z" class="dfo"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 10 5 0 10z" class="dfb"/></marker>
    <marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfw"/></marker>
  </defs>
  <!-- fuel side -->
  <text x="150" y="30" font-size="24" font-weight="700" class="dto">Fuel: CO, H₂</text>
  <text x="586" y="30" text-anchor="end" font-size="22" class="dt2">out: CO₂, H₂O</text>
  <path d="M176 44V114M214 44V114" class="dso" stroke-width="3.5" marker-end="url(#o)"/>
  <text x="400" y="72" text-anchor="middle" font-size="22" class="dt">CO + O²⁻ → CO₂ + 2e⁻</text>
  <text x="400" y="104" text-anchor="middle" font-size="22" class="dt">H₂ + O²⁻ → H₂O + 2e⁻</text>
  <!-- anode, electrolyte, cathode -->
  <rect x="150" y="124" width="436" height="56" class="dfy" fill-opacity=".35"/>
  <rect x="150" y="180" width="436" height="120" class="dfb" fill-opacity=".2"/>
  <rect x="150" y="300" width="436" height="56" class="dfo" fill-opacity=".4"/>
  <rect x="150" y="124" width="436" height="232" fill="none" class="ds2" stroke-width="3"/>
  <path d="M150 180H586M150 300H586" class="ds2" stroke-width="2"/>
  <text x="164" y="161" font-size="22" class="dt2">ANODE</text>
  <text x="252" y="161" font-size="24" font-weight="700" class="dt">Ni–ZrO₂ cermet</text>
  <text x="560" y="162" text-anchor="middle" font-size="32" font-weight="700" class="dt">−</text>
  <text x="380" y="236" text-anchor="middle" font-size="26" font-weight="700" class="dtb">YSZ electrolyte</text>
  <text x="380" y="270" text-anchor="middle" font-size="22" class="dt2">works at ≈ 1000 °C</text>
  <path d="M200 290V192" class="ds" stroke-width="4" marker-end="url(#w)"/>
  <text x="212" y="226" font-size="24" font-weight="700" class="dt">O²⁻</text>
  <text x="164" y="337" font-size="22" class="dt2">CATHODE</text>
  <text x="276" y="337" font-size="24" font-weight="700" class="dt">LaMnO₃</text>
  <text x="560" y="339" text-anchor="middle" font-size="30" font-weight="700" class="dt">+</text>
  <!-- external circuit -->
  <path d="M150 152H60V222M60 306V328H150" fill="none" class="ds" stroke-width="3"/>
  <circle cx="60" cy="264" r="42" class="dfr" fill-opacity=".25"/>
  <circle cx="60" cy="264" r="42" fill="none" class="dsr" stroke-width="3"/>
  <text x="60" y="272" text-anchor="middle" font-size="22" font-weight="700" class="dt">load</text>
  <path d="M136 140H92" class="dsb" stroke-width="3" marker-end="url(#b)"/>
  <text x="112" y="130" text-anchor="middle" font-size="22" class="dtb">e⁻</text>
  <path d="M92 342H136" class="dsb" stroke-width="3" marker-end="url(#b)"/>
  <text x="112" y="374" text-anchor="middle" font-size="22" class="dtb">e⁻</text>
  <!-- air side -->
  <text x="400" y="392" text-anchor="middle" font-size="22" class="dt">½O₂ + 2e⁻ → O²⁻</text>
  <path d="M176 446V366M214 446V366" class="dsb" stroke-width="3.5" marker-end="url(#b)"/>
  <text x="150" y="476" font-size="24" font-weight="700" class="dtb">Air in</text>
  <text x="586" y="476" text-anchor="end" font-size="22" class="dt2">out: excess air</text>
</svg>
